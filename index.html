<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Figline</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #FBFAF7;
    color: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.7;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  main { max-width: 520px; padding: 40px 24px; text-align: center; }
  h1 { font-size: 2.2rem; margin: 0 0 8px; }
  .tagline { color: #6b6b70; margin: 0 0 28px; }
  nav a {
    display: inline-block;
    margin: 6px 8px;
    padding: 10px 18px;
    border: 1px solid #d8d4cc;
    border-radius: 10px;
    color: #1066c4;
    text-decoration: none;
  }
  footer { margin-top: 32px; color: #8a8a8e; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Figline</h1>
  <p class="tagline">Calculate. Label. Remember.</p>
  <nav>
    <a href="/privacy">Privacy Policy</a>
    <a href="/support">Support</a>
    <a href="/tokushoho">特定商取引法に基づく表記</a>
  </nav>
  <footer>A calculator-first notes app for everyday numbers.</footer>
</main>

</html>
